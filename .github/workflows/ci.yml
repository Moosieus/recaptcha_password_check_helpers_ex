name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.18.x", "1.19.x", "1.20.x"]
        otp: ["27.x", "28.x", "29.x"]
        exclude:
          - elixir: "1.18.x"
            otp: "29.x"
          - elixir: "1.19.x"
            otp: "29.x"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      # scrypt is a rebar3 project that shells out to `make -C c_src`. A failure here is a
      # build-environment problem rather than a test failure, so it gets its own step.
      - name: Compile dependencies
        run: mix deps.compile

      # `:integration` is excluded in test_helper.exs, so this needs no credentials.
      - name: Run tests
        run: mix test

  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27.x"
          elixir-version: "1.20.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile without warnings
        run: mix compile --warnings-as-errors --force

      # Guards `package.files`: the moduledoc splices its example out of README.md at
      # compile time, so dropping it fails here. Does not validate `docs.extras`.
      - name: Build the Hex package
        run: mix hex.build

  # One stable required status check, so the ruleset survives matrix changes.
  # `if: always()` is load-bearing -- without it this job is skipped when a
  # dependency fails, and a skipped check can satisfy a branch rule.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: always()

    steps:
      - name: Fail unless every job succeeded
        run: |
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.quality.result }}" = "success" ] || exit 1
